# Lab routage : AS65001 (r1, r2, r3 en OSPF) <-- eBGP --> AS65002 (r4, r5 en OSPF)
# Prérequis : image construite avec  docker build -t frr-ssh:10.2.1 docker/
name: frr-lab

mgmt:
  network: clab-mgmt
  ipv4-subnet: 172.20.20.0/24

topology:
  nodes:
    # --- Bastion SSH (phase C4) : relais vers les adresses de gestion, sur le réseau de management seulement ---
    # Image : docker build -t netcheck-bastion:1 docker/bastion/ ; clé et liste PermitOpen posées après le
    # déploiement par lab-access/bastion_lab.sh. Aucun lien de données, aucune config de routeur modifiée.
    bastion:
      kind: linux
      image: netcheck-bastion:1
      mgmt-ipv4: 172.20.20.2
    # --- Routeurs AS65001 ---
    r1:
      kind: linux
      image: frr-ssh:10.2.1
      mgmt-ipv4: 172.20.20.11
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/r1/frr.conf:/etc/frr/frr.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv6.conf.all.forwarding=1
    r2:
      kind: linux
      image: frr-ssh:10.2.1
      mgmt-ipv4: 172.20.20.12
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/r2/frr.conf:/etc/frr/frr.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv6.conf.all.forwarding=1
        - ip link add DEMO type vrf table 100
        - ip link set DEMO up
        - ip link add dum-demo type dummy
        - ip link set dum-demo master DEMO
        - ip link set dum-demo up
    r3:
      kind: linux
      image: frr-ssh:10.2.1
      mgmt-ipv4: 172.20.20.13
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/r3/frr.conf:/etc/frr/frr.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv6.conf.all.forwarding=1

    # --- Routeurs AS65002 ---
    r4:
      kind: linux
      image: frr-ssh:10.2.1
      mgmt-ipv4: 172.20.20.14
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/r4/frr.conf:/etc/frr/frr.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv6.conf.all.forwarding=1
    r5:
      kind: linux
      image: frr-ssh:10.2.1
      mgmt-ipv4: 172.20.20.15
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/r5/frr.conf:/etc/frr/frr.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv6.conf.all.forwarding=1

    # --- Postes clients (adresse + routes vers le reste du lab) ---
    pc1:
      kind: linux
      image: ghcr.io/hellt/network-multitool
      mgmt-ipv4: 172.20.20.21
      exec:
        - ip addr add 192.168.1.10/24 dev eth1
        - ip route add 10.0.0.0/8 via 192.168.1.1
        - ip route add 172.16.34.0/30 via 192.168.1.1
        - ip route add 192.168.2.0/24 via 192.168.1.1
        - ip addr add 2001:db8:a1::10/64 dev eth1
        - ip -6 route add 2001:db8::/32 via 2001:db8:a1::1
    pc2:
      kind: linux
      image: ghcr.io/hellt/network-multitool
      mgmt-ipv4: 172.20.20.22
      exec:
        - ip addr add 192.168.2.10/24 dev eth1
        - ip route add 10.0.0.0/8 via 192.168.2.1
        - ip route add 172.16.34.0/30 via 192.168.2.1
        - ip route add 192.168.1.0/24 via 192.168.2.1
        - ip addr add 2001:db8:a2::10/64 dev eth1
        - ip -6 route add 2001:db8::/32 via 2001:db8:a2::1

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]   # 10.1.12.0/30
    - endpoints: ["r1:eth2", "r3:eth1"]   # 10.1.13.0/30
    - endpoints: ["r2:eth2", "r3:eth2"]   # 10.1.23.0/30
    - endpoints: ["r3:eth3", "r4:eth1"]   # 172.16.34.0/30 (eBGP)
    - endpoints: ["r4:eth2", "r5:eth1"]   # 10.2.45.0/30
    - endpoints: ["r1:eth3", "pc1:eth1"]  # 192.168.1.0/24
    - endpoints: ["r5:eth2", "pc2:eth1"]  # 192.168.2.0/24
