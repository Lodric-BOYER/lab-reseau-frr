# Compte netcheck-ro (phase C5) : clé seulement, aucun transfert, aucun agent, aucun X11, aucun tunnel.
# PermitTTY reste actif : Netmiko ouvre un shell interactif. Le reste (commandes) est imposé par doas.
Match User netcheck-ro
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitUserRC no
    PermitTTY yes
