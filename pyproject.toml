[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netcheck"
dynamic = ["version"]
description = "Validation de changement reseau et audit de conformite (lab FRR)."
readme = "netcheck/README.md"
requires-python = ">=3.11"
dependencies = [
    "netmiko>=4.4",
    "PyYAML>=6.0",
    "jinja2>=3.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
netcheck = "netcheck.cli:main"

[tool.hatch.version]
path = "netcheck/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["netcheck"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Base raisonnable : erreurs pyflakes, style pycodestyle, imports non tries. Pas de reformatage
# (pas de regle "style d'ecriture" type quotes/commas) : on corrige des bugs potentiels et des
# incoherences, pas l'esthetique du code existant.
select = ["E", "F", "W", "I"]
