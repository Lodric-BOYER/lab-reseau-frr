frr defaults traditional
hostname r5
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 10.2.255.5/32
 ip ospf area 0
 ip ospf passive
exit
!
interface eth1
 description vers-r4
 ip address 10.2.45.2/30
 ip ospf area 0
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 lab-ospf-r4r5
 ip ospf network point-to-point
exit
!
interface eth2
 description LAN-pc2
 ip address 192.168.2.1/24
 ip ospf area 0
 ip ospf passive
exit
!
router ospf
 ospf router-id 10.2.255.5
exit
!
end
