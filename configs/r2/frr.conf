frr defaults traditional
hostname r2
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 10.1.255.2/32
 ip ospf area 0
 ip ospf passive
exit
!
interface eth1
 description vers-r1
 ip address 10.1.12.2/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface eth2
 description vers-r3
 ip address 10.1.23.1/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
router ospf
 ospf router-id 10.1.255.2
exit
!
end
