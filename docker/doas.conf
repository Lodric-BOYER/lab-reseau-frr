# /etc/doas.conf de l'image frr-ssh (phase C5, compte netcheck-ro en lecture seule).
# Dix règles, UNE par commande du driver FRR (netcheck/drivers/frr.py, `_cli`), à arguments EXACTS :
#   - « as frr », jamais root : les sockets de vtysh sont frr:frrvty, l'utilisateur frr suffit ;
#   - aucune option keepenv ni setenv : doas réinitialise l'environnement (VTYSH_PAGER, PAGER, LD_PRELOAD de
#     l'appelant n'atteignent pas vtysh ; preuve négative dans tests/lib_ro.sh) ;
#   - pas de joker : un argument en plus, un -c en plus ou une autre commande est refusé (« Operation not permitted »).
# `-u` (vue native de vtysh) en seconde couche partout où la vue existe ; `show running-config` n'y existe pas.
# tests/test_frr_privilege_wrapper.py garde ce fichier identique à la liste blanche du driver.
permit nopass netcheck-ro as frr cmd /usr/bin/vtysh args -u -c "show interface json"
permit nopass netcheck-ro as frr cmd /usr/bin/vtysh args -u -c "show ip route vrf all json"
permit nopass netcheck-ro as frr cmd /usr/bin/vtysh args -u -c "show ipv6 route vrf all json"
permit nopass netcheck-ro as frr cmd /usr/bin/vtysh args -u -c "show ip ospf neighbor json"
permit nopass netcheck-ro as frr cmd /usr/bin/vtysh args -u -c "show ipv6 ospf6 neighbor json"
permit nopass netcheck-ro as frr cmd /usr/bin/vtysh args -u -c "show bgp ipv4 unicast summary json"
permit nopass netcheck-ro as frr cmd /usr/bin/vtysh args -u -c "show bgp ipv4 unicast json"
permit nopass netcheck-ro as frr cmd /usr/bin/vtysh args -u -c "show bgp ipv6 unicast summary json"
permit nopass netcheck-ro as frr cmd /usr/bin/vtysh args -u -c "show bgp ipv6 unicast json"
permit nopass netcheck-ro as frr cmd /usr/bin/vtysh args -c "show running-config"
