# Inventaire du lab multi-constructeurs (Phase C/D, SPEC_v2.md), utilisé avec
# `netcheck -i automation/inventory-multivendor.yml ...`. Mêmes adresses de management que
# lab-multivendor.clab.yml (172.20.21.0/24). r1-r4 = FRR, identiques à inventory.yml (C9) ;
# r5 = Nokia SR Linux (driver "srlinux", champ lu uniquement par collector.py._resolve_driver).
#
# Identifiants r5 (admin / NokiaSrl1!) : ce sont les identifiants PAR DÉFAUT de l'image
# containerlab SR Linux, valables uniquement sur ce lab de développement -- jamais des
# identifiants de production. Acceptés en clair ici car ce fichier est l'un des deux seuls
# emplacements autorisés à les contenir (C11), l'autre étant les variables d'environnement.
# Sur un vrai déploiement, surcharger via les variables d'environnement plutôt que ce fichier.
#
# Résolution des identifiants (netcheck/inventory.py), du plus spécifique au moins spécifique :
#   NETCHECK_<DRIVER>_USER/PASS  >  NETCHECK_USER/PASS  >  LAB_USER/PASS  >  ce fichier
# Sur un inventaire mixte, NETCHECK_USER/PASS s'applique à TOUS les routeurs (y compris r5) --
# pour cibler un seul driver, utiliser la variable spécifique, ex. NETCHECK_SRLINUX_USER/PASS
# pour ne surcharger que r5 sans toucher aux identifiants FRR de r1-r4.
# Inventaire de LAB (phase C1) : seul un inventaire qui le déclare permet `--host-keys accept-new`
# (premier contact enregistré sans vérification). Ne jamais mettre `lab: true` sur un vrai réseau.
lab: true

defaults:
  device_type: linux      # Netmiko se connecte au shell Alpine, puis lance vtysh
  username: netops
  password: netops
  vtysh: vtysh

# Interfaces de management ignorées par netcheck (diff et conformité) : eth0 (r1-r4, kind
# "linux") et mgmt0 (r5, kind "nokia_srlinux" -- nom différent, architecture SR Linux réelle).
management_interfaces: [eth0, mgmt0]
# VRF de management ignorées comme les interfaces ci-dessus (phase B2) : l'instance réseau mgmt de SR Linux (r5)
# porte mgmt0 et ses routes ; sans cette ligne, elles apparaîtraient dans les relevés, diff et assertions.
management_vrfs: [mgmt]

# ospf_neighbors : nombre de voisins OSPF attendus en état Full
# bgp_peers      : voisin BGP -> nombre minimal de préfixes reçus attendus
routers:
  r1: {host: 172.20.21.11, ospf_neighbors: 2}
  r2: {host: 172.20.21.12, ospf_neighbors: 2}
  r3: {host: 172.20.21.13, ospf_neighbors: 2, bgp_peers: {172.16.34.2: 2}}
  r4: {host: 172.20.21.14, ospf_neighbors: 1, bgp_peers: {172.16.34.1: 2}}
  r5:
    host: 172.20.21.15
    driver: srlinux
    device_type: nokia_srl
    username: admin
    password: NokiaSrl1!
    ospf_neighbors: 1
