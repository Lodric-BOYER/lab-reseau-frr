[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "netcheck"
dynamic = ["version"]
description = "Validation de changement reseau et audit de conformite (lab FRR)."
readme = "netcheck/README.md"
# Expression SPDX (PEP 639). Toute dependance doit rester compatible : MIT, BSD ou Apache-2.0 ;
# pas de licence copyleft (GPL) sans decision explicite.
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "netmiko>=4.4",
    "PyYAML>=6.0",
    "jinja2>=3.1",
    "rich>=13.0",
]

[project.optional-dependencies]
# Fournisseur de secrets Vault / OpenBao (phase C3) : bibliotheque hvac (Apache-2.0), jamais requise par defaut.
vault = [
    "hvac>=2.4,<3",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "hvac>=2.4,<3",
]

[project.scripts]
netcheck = "netcheck.cli:main"

[tool.hatch.version]
path = "netcheck/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["netcheck"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Base raisonnable : erreurs pyflakes, style pycodestyle, imports non tries. Pas de reformatage
# (pas de regle "style d'ecriture" type quotes/commas) : on corrige des bugs potentiels et des
# incoherences, pas l'esthetique du code existant.
select = ["E", "F", "W", "I"]
